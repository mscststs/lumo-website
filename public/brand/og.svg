<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Lumo — A calmer, more capable web</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c14"/>
      <stop offset="0.55" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="190" cy="170" rx="420" ry="320" fill="url(#glow1)"/>
  <ellipse cx="1040" cy="180" rx="360" ry="300" fill="url(#glow2)"/>

  <g transform="translate(150 210)">
    <g filter="url(#soft)" opacity="0.7">
      <polygon points="0,-70 132,-4 0,62 -132,-4" fill="url(#mark)"/>
    </g>
    <g stroke="#cffafe" stroke-opacity="0.72" stroke-width="2.2" stroke-linejoin="round">
      <polygon points="0,64 126,127 0,190 -126,127" fill="url(#mark)" fill-opacity="0.24"/>
      <polygon points="0,24 126,87 0,150 -126,87" fill="url(#mark)" fill-opacity="0.4"/>
      <polygon points="0,-16 126,47 0,110 -126,47" fill="url(#mark)" fill-opacity="0.62"/>
      <polygon points="0,-56 126,7 0,70 -126,7" fill="url(#mark)" fill-opacity="0.86"/>
      <polygon points="0,-96 126,-33 0,30 -126,-33" fill="url(#mark)"/>
    </g>
    <circle cx="0" cy="-96" r="7" fill="#ecfeff"/>
    <circle cx="0" cy="-96" r="18" fill="#22d3ee" fill-opacity="0.35" filter="url(#soft)"/>
  </g>

  <text x="392" y="214" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="600" letter-spacing="8" fill="#8b93a7">LUMO</text>
  <text x="392" y="318" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="700" letter-spacing="-4" fill="#f5f7fa">A calmer,</text>
  <text x="392" y="408" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="86" font-weight="700" letter-spacing="-4" fill="url(#accent)">more capable web.</text>
  <text x="392" y="474" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="25" font-weight="500" fill="#c7ccd8">AI browser sidebar · Userscript manager</text>

  <rect x="392" y="516" width="1" height="0" fill="#000"/>
  <text x="392" y="548" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="1" fill="#8b93a7">LOCAL-FIRST · CHROME MV3 · OPEN SOURCE</text>

  <g opacity="0.9">
    <rect x="900" y="500" width="204" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="926" cy="522" r="5" fill="#34d399"/>
    <text x="942" y="528" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#c7ccd8">Built in the open</text>
  </g>
</svg>
